# Build output is not source, and leaving it in makes the set of linted files depend on what an earlier build left behind.
excluded:
  - build
  - swift/lib/Sources/AnyCodable
  - flutter/plugin/example

disabled_rules:
  - opening_brace
  - trailing_comma

line_length:
  warning: 200
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 1

file_length:
  warning: 600
  error: 600

type_body_length:
  warning: 500
  error: 500
