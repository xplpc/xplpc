# The sources are named one by one, so a build directory or a nested checkout is never what gets read.
included:
  - swift/lib/Sources
  - swift/tests/Sources
  - swift/sample
  - flutter/plugin/ios/xplpc
  - flutter/plugin/macos/xplpc

excluded:
  - swift/lib/Sources/AnyCodable

disabled_rules:
  - opening_brace
  - trailing_comma

line_length:
  warning: 200
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 1

file_length:
  warning: 600
  error: 600

type_body_length:
  warning: 500
  error: 500
