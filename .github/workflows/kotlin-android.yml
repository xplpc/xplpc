name: Kotlin Android

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extras/images/**'

# The default branch is never cancelled, since that is where publishing happens.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Ubuntu Latest",
            os: ubuntu-latest
          }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.3.3"

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          version: "1.13.2"

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "17"

      - name: Install NDK (only when use cpm)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true

      - name: Verify
        run: |
          python3 --version
          cmake --version
          ninja --version
          java -version
          ndk-build -version

      - name: Get AVD info
        uses: ./.github/actions/get-avd-info
        id: avd-info

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Conan (only when use conan)
        run: python3 xplpc.py conan-setup

      - name: Build
        run: python3 xplpc.py kotlin-build --platform android
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build AAR
        run: python3 xplpc.py kotlin-build-aar --platform android

      - name: Build Sample
        run: python3 xplpc.py kotlin-build-sample --platform android

      - name: Android Lint
        run: |
          ./kotlin/android/lib/gradlew -p kotlin/android/lib :library:lintDebug
          ./kotlin/android/sample/gradlew -p kotlin/android/sample :app:lintDebug

      - name: Verify The Keep Rules Survived R8
        run: |
          seeds=kotlin/android/sample/app/build/outputs/mapping/release/seeds.txt
          cat "$seeds" | grep -E "com\.xplpc\.(message\.Param|serializer\.JsonSerializer)" || true
          for field in \
            "com.xplpc.message.Param: java.lang.String n" \
            "com.xplpc.message.Param: java.lang.Object v" \
            "com.xplpc.serializer.JsonSerializer\$JsonRequestData: java.lang.String f" \
            "com.xplpc.serializer.JsonSerializer\$JsonRequestData: java.util.ArrayList p" \
            "com.xplpc.serializer.JsonSerializer\$JsonFunctionReturnValueData: java.lang.Object r"; do
            grep -qF "$field" "$seeds" || { echo "r8 did not keep: $field"; exit 1; }
          done
          echo "every field the wire format reads by name survived"

      - name: Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: ${{ steps.avd-info.outputs.arch }}
          target: default
          disable-animations: true
          force-avd-creation: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb devices
            python3 xplpc.py kotlin-test --platform android
