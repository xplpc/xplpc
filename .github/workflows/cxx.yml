name: C++

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extras/images/**'

# The default branch is never cancelled, so every commit there keeps a complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows Latest MSVC",
            os: windows-latest,
            leaks: false,
            sanitizers: false
          }
        - {
            name: "Windows Latest MinGW",
            os: windows-latest,
            cc: "gcc",
            cxx: "g++",
            generator: "MinGW Makefiles",
            leaks: false,
            sanitizers: false
          }
        - {
            name: "Ubuntu Latest GCC",
            os: ubuntu-latest,
            cc: "gcc",
            cxx: "g++",
            generator: "Ninja",
            leaks: false,
            sanitizers: true
          }
        - {
            name: "macOS Latest Clang",
            os: macos-latest,
            cc: "clang",
            cxx: "clang++",
            generator: "Ninja",
            leaks: true,
            sanitizers: true
          }

    # The compiler and the generator reach cmake and conan through the environment, and the msvc config leaves all three empty so the platform default is what it builds with.
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}
      CMAKE_GENERATOR: ${{ matrix.config.generator }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.5.1"

      - name: Install Ninja
        if: runner.os != 'Windows'
        run: python3 -m pip install ninja==1.13.2

      - name: Verify
        run: |
          python3 --version
          cmake --version

      - name: Verify Ninja
        if: runner.os != 'Windows'
        run: ninja --version

      - name: Conan
        run: python3 xplpc.py conan-setup

      - name: Test
        run: python3 xplpc.py cxx-test

      - name: Test In A Random Order
        run: python3 xplpc.py cxx-test --shuffle --incremental

      - name: Test With Conan
        run: python3 xplpc.py cxx-test --dependency-tool conan

      - name: Test With Address Sanitizer
        if: matrix.config.sanitizers == true
        run: python3 xplpc.py cxx-test --sanitizer address

      - name: Test With Debug Logging
        if: matrix.config.sanitizers == true
        env:
          XPLPC_LOG_LEVEL: debug
        run: python3 xplpc.py cxx-test --sanitizer address

      - name: Test With Thread Sanitizer
        if: matrix.config.sanitizers == true
        run: python3 xplpc.py cxx-test --sanitizer thread

      - name: Test With Undefined Behavior Sanitizer
        if: matrix.config.sanitizers == true
        run: python3 xplpc.py cxx-test --sanitizer undefined

      - name: Build
        run: python3 xplpc.py cxx-build-static

      - name: Build Sample
        run: python3 xplpc.py cxx-build-sample

      - name: Run Sample
        run: python3 xplpc.py cxx-run-sample

      - name: Test Consumer
        run: python3 xplpc.py cxx-test-consumer

      - name: Leaks
        if: matrix.config.leaks == true
        run: python3 xplpc.py cxx-build-leaks
