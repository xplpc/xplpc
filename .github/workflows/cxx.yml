name: C++

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extras/images/**'

# The default branch is never cancelled, since that is where publishing happens.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows Latest MSVC",
            os: windows-latest,
            artifact: "windows_msvc.7z",
            build_type: "Release",
            cc: "cl",
            cxx: "cl",
            generators: "Visual Studio 17 2022",
            leaks: false,
            sanitizers: false,
            conan: true
          }
        - {
            name: "Windows Latest MinGW",
            os: windows-latest,
            artifact: "windows_mingw.7z",
            build_type: "Release",
            cc: "gcc",
            cxx: "g++",
            generators: "MinGW Makefiles",
            leaks: false,
            sanitizers: false,
            conan: true
          }
        - {
            name: "Ubuntu Latest GCC",
            os: ubuntu-latest,
            artifact: "ubuntu_gcc.7z",
            build_type: "Release",
            cc: "gcc",
            cxx: "g++",
            generators: "Ninja",
            leaks: false,
            sanitizers: true,
            conan: true
          }
        - {
            name: "macOS Latest Clang",
            os: macos-latest,
            artifact: "macos_clang.7z",
            build_type: "Release",
            cc: "clang",
            cxx: "clang++",
            generators: "Ninja",
            leaks: true,
            sanitizers: true,
            conan: true
          }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.3.3"

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          version: "1.13.2"

      - name: Verify
        run: |
          python3 --version
          cmake --version
          ninja --version

      - name: Conan
        run: python3 xplpc.py conan-setup

      - name: Test
        run: python3 xplpc.py cxx-test

      - name: Test In A Random Order
        env:
          GTEST_SHUFFLE: 1
        run: python3 xplpc.py cxx-test

      - name: Test With Conan
        if: matrix.config.conan
        run: python3 xplpc.py cxx-test --dependency-tool conan

      - name: Test With Address Sanitizer
        if: matrix.config.sanitizers == true
        run: python3 xplpc.py cxx-test --sanitizer address

      - name: Test With Debug Logging
        if: matrix.config.sanitizers == true
        env:
          XPLPC_LOG_LEVEL: debug
        run: python3 xplpc.py cxx-test --sanitizer address

      - name: Test With Thread Sanitizer
        if: matrix.config.sanitizers == true
        run: python3 xplpc.py cxx-test --sanitizer thread

      - name: Test With Undefined Behavior Sanitizer
        if: matrix.config.sanitizers == true
        run: python3 xplpc.py cxx-test --sanitizer undefined

      - name: Build
        run: python3 xplpc.py cxx-build-static

      - name: Build Sample
        run: python3 xplpc.py cxx-build-sample

      - name: Run Sample
        run: python3 xplpc.py cxx-run-sample

      - name: Leaks
        if: matrix.config.leaks == true
        run: python3 xplpc.py cxx-build-leaks
