name: WASM

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'extras/images/**'

# The default branch is never cancelled, since that is where publishing happens.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Ubuntu Latest GCC",
            os: ubuntu-latest,
            artifact: "ubuntu_gcc.7z",
            build_type: "Release",
            cc: "gcc",
            cxx: "g++",
            generators: "Ninja",
          }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.3.3"

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          version: "1.13.2"

      - name: Install EMSDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.4"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: 'x64'

      - name: Verify
        run: |
          python3 --version
          cmake --version
          ninja --version
          node --version
          npm --version
          emcc -v

      - name: Conan
        run: python3 xplpc.py conan-setup

      - name: Build
        run: python3 xplpc.py wasm-build

      - name: Test
        run: python3 xplpc.py wasm-test

      - name: Build Sample
        run: python3 xplpc.py wasm-build-sample

      - name: Serve Sample
        run: |
          python3 xplpc.py wasm-serve-sample > /tmp/serve.log 2>&1 &
          sleep 8
          page=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/wasm-demo/)
          script=$(curl -sS http://127.0.0.1:8000/wasm-demo/ | grep -oE 'src="[^"]+\.js"' | head -1 | sed 's/src="//;s/"//')
          asset=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000${script}")
          cat /tmp/serve.log
          echo "page ${page} asset ${asset}"
          test "${page}" = "200" && test "${asset}" = "200"

      - name: Verify Formatting
        run: |
          python3 xplpc.py wasm-format
          git diff --exit-code

      - name: Generate Fallback Files
        if: github.ref == 'refs/heads/main'
        working-directory: wasm/sample/dist
        run: |
          cp index.html 200.html
          cp index.html 404.html

      - name: Publish
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          ssh-key: ${{ secrets.PUBLISH_KEY }}
          repository-name: "xplpc/wasm-demo"
          folder: wasm/sample/dist
          single-commit: true
          branch: main

  sanitizer:
    name: "Module Under The ${{ matrix.sanitizer }} Sanitizer"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.3.3"

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          version: "1.13.2"

      - name: Install EMSDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.4"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: 'x64'

      - name: Build With Sanitizer
        run: python3 xplpc.py wasm-build --sanitizer ${{ matrix.sanitizer }}

      - name: Confirm The Sanitizer Reached The Module
        run: |
          grep -qiE "asan|ubsan|sanitiz" build/wasm/wasm32/bin/xplpc.js || \
            (echo "the sanitizer did not reach the module, the run would prove nothing" && exit 1)

      - name: Test
        run: python3 xplpc.py wasm-test
