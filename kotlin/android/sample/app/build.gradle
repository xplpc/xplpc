plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xplpc.runner'

    defaultConfig {
        applicationId "com.xplpc.runner"

        minSdk = 23
        targetSdk = 37
        compileSdk = 37

        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            debugSymbolLevel 'full'
        }
    }


    lint {
        // A dependency this project pins on purpose is not a finding, and an adaptive icon and a ktx
        // helper are not defects in a sample whose job is to show a call crossing the bridge.
        disable 'GradleDependency', 'AndroidGradlePluginVersion', 'MonochromeLauncherIcon', 'UseKtx'
        warningsAsErrors true
        abortOnError true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // The sample is signed with the debug keys so ci can run the minified variant without a release keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation project(path: ':xplpc')

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'com.google.android.material:material:1.14.0'

    implementation 'androidx.camera:camera-view:1.6.1'
    implementation 'androidx.camera:camera-lifecycle:1.6.1'
    implementation 'androidx.camera:camera-video:1.6.1'
    implementation 'androidx.camera:camera-camera2:1.6.1'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'


    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.9.0"))
}
