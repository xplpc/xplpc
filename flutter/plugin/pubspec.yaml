name: xplpc
description: XPLPC Dart Plugin.
version: 1.0.0
homepage: "https://github.com/xplpc/xplpc"

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  ffi: ^2.2.0
  logging: ^1.3.0
  reflectable: ^5.2.3

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.31.2
  build_runner: ^2.15.1
  reflectable_builder: ^1.2.3

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
