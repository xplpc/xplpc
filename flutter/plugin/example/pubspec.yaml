name: xplpc_example
description: Demonstrates how to use the XPLPC plugin.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  reflectable: ^5.2.3
  cupertino_icons: ^1.0.9
  battery_plus: ^7.1.1

  xplpc:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  reflectable_builder: ^1.2.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
